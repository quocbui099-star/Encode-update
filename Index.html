<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HVQ TOOLS 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000;
    color: #d7f4ff;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  input, textarea, select, button { font-size: 16px !important; }

  .app { max-width: 480px; margin: 0 auto; position: relative; z-index: 2; }

  #matrixCanvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; opacity: 0.35;
    pointer-events: none;
  }

  /* ═══ LOGIN SCREEN ═══ */
  #loginScreen {
    position: relative; z-index: 2;
    min-height: 85vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px 0;
  }

  .login-box {
    width: 100%; max-width: 360px;
    background: rgba(0, 10, 16, 0.92);
    border: 2px solid #00ff88;
    border-radius: 16px;
    padding: 28px 22px;
    box-shadow: 0 0 30px rgba(0,255,136,0.5), inset 0 0 20px rgba(0,255,136,0.05);
    text-align: center;
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }

  .login-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    animation: scanline 3s linear infinite;
    box-shadow: 0 0 10px #00ff88;
  }

  @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes glitch {
    0%, 100% { text-shadow: 0 0 15px #00ff88, 0 0 30px #00ff88; }
    50% { text-shadow: -2px 0 #00c6fc, 2px 0 #ff00ff, 0 0 15px #00ff88; }
  }
  @keyframes bolt {
    0%, 100% { filter: drop-shadow(0 0 8px #00ff88) brightness(1); }
    50% { filter: drop-shadow(0 0 20px #00ff88) brightness(1.3); }
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @keyframes logoutPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 0; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .lock-wrap {
    position: relative;
    width: 90px; height: 90px;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
  }

  .lock-img {
    width: 90px; height: 90px;
    border-radius: 50%;
    object-fit: cover;
    filter: drop-shadow(0 0 15px #00ff88);
    animation: pulse 2s ease-in-out infinite;
    border: 2px solid #00ff88;
  }

  .lock-bolt {
    position: absolute;
    bottom: -8px; right: -8px;
    width: 36px; height: 36px;
    background: #000;
    border: 2px solid #00ff88;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    animation: bolt 1.5s ease-in-out infinite;
    box-shadow: 0 0 15px rgba(0,255,136,0.6);
  }

  .bolt-svg { width: 20px; height: 20px; filter: drop-shadow(0 0 6px #00ff88); }
  .bolt-svg path { fill: #00ff88; }

  .login-title {
    color: #00ff88;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 6px;
    animation: glitch 3s infinite;
    font-family: monospace;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
  }

  .login-title .bolt-icon { width: 22px; height: 22px; filter: drop-shadow(0 0 10px #00ff88); }
  .login-title .bolt-icon path { fill: #00ff88; }

  .login-sub {
    color: #00a860;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 22px;
    font-weight: 700;
    font-family: monospace;
  }

  .terminal {
    text-align: left;
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #00a860;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 14px;
    font-family: monospace;
    font-size: 9px;
    color: #00ff88;
    line-height: 1.6;
    height: 60px;
    overflow: hidden;
    position: relative;
  }

  #terminalText { white-space: pre-wrap; }

  .cursor {
    display: inline-block;
    width: 6px; height: 10px;
    background: #00ff88;
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  .login-input {
    width: 100%;
    padding: 14px 16px;
    background: #000;
    color: #00ff88;
    border: 2px solid #00ff88;
    border-radius: 8px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 4px;
    font-family: monospace;
    outline: none;
    transition: box-shadow .2s, border-color .2s;
    margin-bottom: 10px;
    font-size: 16px !important;
    -webkit-appearance: none;
  }

  .login-input:focus {
    box-shadow: 0 0 25px rgba(0,255,136,0.7), inset 0 0 10px rgba(0,255,136,0.15);
    border-color: #00ff88;
  }

  .login-input::placeholder {
    color: #005a30;
    letter-spacing: 1.5px;
  }

  .login-err {
    color: #ff3b3b;
    font-size: 12px;
    font-weight: 700;
    min-height: 18px;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
    font-family: monospace;
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, #00ff88, #009955);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,255,136,0.6);
    transition: all .15s;
    font-family: monospace;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
  }

  .login-btn:hover { box-shadow: 0 0 35px #00ff88; transform: translateY(-2px); }
  .login-btn:active { transform: translateY(0); }

  /* ═══ MAIN APP ═══ */
  #mainApp { display: none; }
  #mainApp.show { display: block; }

  .header {
    text-align: center;
    margin-bottom: 14px;
    padding: 12px;
    background: rgba(0, 10, 16, 0.92);
    border: 2px solid #00ff88;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,255,136,0.4), inset 0 0 20px rgba(0,255,136,0.05);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    animation: scanline 3s linear infinite;
    box-shadow: 0 0 10px #00ff88;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 900;
    color: #00ff88;
    letter-spacing: 2px;
    margin-bottom: 2px;
    animation: glitch 3s infinite;
    font-family: monospace;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
  }

  .header h1 .bolt-icon { width: 18px; height: 18px; filter: drop-shadow(0 0 8px #00ff88); }
  .header h1 .bolt-icon path { fill: #00ff88; }

  .header p {
    color: #00a860;
    font-size: 9px;
    letter-spacing: 3px;
    font-weight: 700;
    font-family: monospace;
  }

  /* LOGOUT — CHỈ KÝ HIỆU X, KHÔNG ẢNH */
  .logout-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: linear-gradient(135deg, #1a0000, #000);
    border: 2px solid #ff3b3b;
    border-radius: 50%;
    width: 38px; height: 38px;
    padding: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s;
    box-shadow: 0 0 12px rgba(255,59,59,0.5), inset 0 0 8px rgba(255,59,59,0.2);
    overflow: hidden;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 10;
    color: #ff3b3b;
    font-size: 18px;
    font-weight: 900;
    font-family: monospace;
    text-shadow: 0 0 8px #ff3b3b;
    line-height: 1;
  }

  .logout-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,59,59,0.4);
    animation: logoutPulse 2s infinite;
    pointer-events: none;
  }

  .logout-btn:hover {
    box-shadow: 0 0 25px #ff3b3b, inset 0 0 15px rgba(255,59,59,0.4);
    transform: scale(1.08);
    border-color: #ff5566;
    color: #fff;
    text-shadow: 0 0 12px #ff5566;
  }

  .logout-btn:active { transform: scale(0.92); }

  .timer-bar {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #00a860;
    font-size: 10px;
    font-weight: 700;
    color: #00a860;
    font-family: monospace;
  }

  #sessionTimer {
    color: #00ff88;
    font-family: monospace;
    font-size: 11px;
    font-weight: 900;
  }

  /* TOOL BOX */
  .tool-box {
    background: rgba(0, 10, 16, 0.92);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 0 20px rgba(0,255,136,0.25), inset 0 0 15px rgba(0,255,136,0.03);
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }

  .tool-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    animation: scanline 4s linear infinite;
    opacity: 0.6;
  }

  .tool-title {
    color: #00ff88;
    font-weight: 900;
    font-size: 11px;
    margin-bottom: 10px;
    letter-spacing: 2px;
    font-family: monospace;
    display: flex; align-items: center;
    gap: 6px;
  }

  .tool-title::before {
    content: '>';
    color: #00ff88;
    animation: blink 1s steps(2) infinite;
  }

  /* DROP ZONE */
  #dropZone {
    background: rgba(0, 20, 10, 0.6);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .3s;
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  #dropZone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, transparent 30%, rgba(0,255,136,0.08) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform .8s;
    pointer-events: none;
  }

  #dropZone:hover::before { transform: translateX(100%); }

  #dropZone:hover {
    border-color: #00ff88;
    box-shadow: 0 0 35px rgba(0,255,136,0.6);
    transform: translateY(-2px);
  }

  #dropZone.dragover { border-color: #00ff88; background: rgba(0,40,20,0.8); box-shadow: 0 0 40px #00ff88; }
  #dropZone.success { border-color: #00ff88; background: rgba(0,40,20,0.8); }
  #dropZone.error { border-color: #ff3b3b; background: rgba(40,0,0,0.8); box-shadow: 0 0 30px #ff3b3b; }

  .drop-icon { font-size: 36px; margin-bottom: 8px; display: block; filter: drop-shadow(0 0 10px #00ff88); }
  .drop-title { font-size: 15px; font-weight: 900; color: #00ff88; text-shadow: 0 0 10px #00ff88; margin-bottom: 4px; letter-spacing: 2px; font-family: monospace; }
  .drop-sub { color: #00a860; font-size: 10px; line-height: 1.5; font-family: monospace; }
  .drop-sub b { color: #00ff88; }
  #fileInput { display: none; }

  /* OPTIONS */
  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .opt {
    display: flex; align-items: center;
    gap: 6px;
    padding: 8px;
    background: rgba(0, 0, 0, 0.7);
    border: 1.5px solid #00a860;
    border-radius: 6px;
    cursor: pointer;
    font-size: 10px;
    font-weight: 700;
    color: #00ff88;
    user-select: none;
    font-family: monospace;
    transition: all .15s;
  }

  .opt:hover { border-color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.4); }

  .opt input {
    appearance: none;
    width: 14px; height: 14px;
    border: 1.5px solid #00ff88;
    border-radius: 3px;
    background: #000;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    -webkit-appearance: none;
  }

  .opt input:checked { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

  .opt input:checked::after {
    content: '✓';
    position: absolute;
    top: -3px; left: 1px;
    color: #000;
    font-weight: 900;
    font-size: 11px;
  }

  /* FILE INFO */
  .file-info {
    background: rgba(0, 20, 10, 0.9);
    border: 2px solid #00ff88;
    border-radius: 12px;
    padding: 12px;
    display: none;
    margin-bottom: 12px;
    box-shadow: 0 0 25px rgba(0,255,136,0.4);
  }

  .file-info.show { display: block; animation: slideIn .3s; }

  .file-name {
    color: #00ff88;
    font-weight: 900;
    font-size: 13px;
    margin-bottom: 10px;
    word-break: break-all;
    font-family: monospace;
    text-shadow: 0 0 8px #00ff88;
  }

  .file-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }

  .stat {
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid #00a860;
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
  }

  .stat-label { color: #00a860; font-size: 8px; font-weight: 700; margin-bottom: 3px; font-family: monospace; letter-spacing: 1px; }
  .stat-value { color: #00ff88; font-size: 12px; font-weight: 900; font-family: monospace; }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .btn {
    flex: 1; min-width: 90px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: 900;
    font-size: 11px;
    cursor: pointer;
    font-family: monospace;
    letter-spacing: 1px;
    transition: all .15s;
    -webkit-appearance: none;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .btn-download { background: linear-gradient(180deg, #00ff88, #009955); color: #000; box-shadow: 0 0 15px rgba(0,255,136,0.5); }
  .btn-copy { background: #000; color: #00ff88; border: 1.5px solid #00ff88; }
  .btn-reset { width: 100%; margin-top: 6px; background: #000; color: #ff3b3b; border: 1.5px solid #ff3b3b; }

  /* PROGRESS */
  .progress { display: none; margin-bottom: 12px; }
  .progress.show { display: block; }

  .progress-bar { height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid #00a860; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00ff88, #00c6fc); width: 0%; transition: width .3s; box-shadow: 0 0 10px #00ff88; }
  .progress-text { color: #00ff88; font-size: 10px; font-weight: 700; text-align: center; margin-top: 6px; font-family: monospace; letter-spacing: 1px; }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 16px 8px;
    color: #00a860;
    font-size: 10px;
    letter-spacing: 1.5px;
    font-weight: 700;
    line-height: 1.8;
    font-family: monospace;
  }

  .footer .credit {
    color: #00ff88;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.2px;
    display: block;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed #00a860;
    text-shadow: 0 0 10px #00ff88;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 10px 20px;
    background: #000;
    border: 2px solid #00ff88;
    border-radius: 8px;
    color: #00ff88;
    font-weight: 700;
    font-size: 12px;
    transition: transform .3s;
    z-index: 999999;
    pointer-events: none;
    text-align: center;
    font-family: monospace;
    letter-spacing: 1px;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: #ff3b3b; color: #ff3b3b; }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="app">

  <!-- ═══ LOGIN SCREEN ═══ -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="lock-wrap">
        <img src="https://i.imgur.com/Wd4Pn4H.jpeg" class="lock-img" alt="lock">
        <div class="lock-bolt">
          <svg class="bolt-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L4.09 12.11c-.4.47-.09 1.89.72 1.89H11l-1 8 8.91-10.11c.4-.47.09-1.89-.72-1.89H13l1-8z"/>
          </svg>
        </div>
      </div>

      <div class="login-title">
        <svg class="bolt-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.09 12.11c-.4.47-.09 1.89.72 1.89H11l-1 8 8.91-10.11c.4-.47.09-1.89-.72-1.89H13l1-8z"/>
        </svg>
        HVQ TOOLS
      </div>
      <div class="login-sub">SECURE ACCESS REQUIRED</div>

      <div class="terminal">
        <div id="terminalText"></div><span class="cursor"></span>
      </div>

      <input type="password" id="keyInput" class="login-input" placeholder="HVQ-XXXX-XXXX-XXXX" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="login-err" id="keyErr"></div>
      <button class="login-btn" id="loginBtn">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.09 12.11c-.4.47-.09 1.89.72 1.89H11l-1 8 8.91-10.11c.4-.47.09-1.89-.72-1.89H13l1-8z" fill="#000"/>
        </svg>
        ACCESS
      </button>
    </div>
  </div>

  <!-- ═══ MAIN APP ═══ -->
  <div id="mainApp">

    <div class="header">
      <h1>
        <svg class="bolt-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4.09 12.11c-.4.47-.09 1.89.72 1.89H11l-1 8 8.91-10.11c.4-.47.09-1.89-.72-1.89H13l1-8z"/>
        </svg>
        HVQ TOOLS
      </h1>
      <p>PREMIUM OBFUSCATOR</p>

      <button class="logout-btn" id="logoutBtn" title="Đăng xuất">✕</button>

      <div class="timer-bar">
        ⏱️ Còn lại: <span id="sessionTimer">Đang tải...</span>
      </div>
    </div>

    <div id="dropZone">
      <input type="file" id="fileInput" accept=".js,.user.js,text/javascript,application/javascript">
      <span class="drop-icon">📁</span>
      <div class="drop-title">KÉO FILE VÀO ĐÂY</div>
      <div class="drop-sub">
        Hoặc <b>click</b> để chọn — Hỗ trợ: <b>.user.js</b>, <b>.js</b>
      </div>
    </div>

    <div class="tool-box">
      <div class="tool-title">TÙY CHỌN MÃ HÓA</div>
      <div class="opt-grid">
        <label class="opt">
          <input type="checkbox" id="optHex">
          <span>🔢 Hex Strings</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="optBracket">
          <span>🔗 Bracket</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="optJunk">
          <span>💩 Junk Code</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="optBase64">
          <span>🔐 Base64</span>
        </label>
      </div>
    </div>

    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName">chưa có file</div>
      <div class="file-stats">
        <div class="stat">
          <div class="stat-label">GỐC</div>
          <div class="stat-value" id="statIn">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">SAU MÃ HÓA</div>
          <div class="stat-value" id="statOut">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">TỈ LỆ</div>
          <div class="stat-value" id="statRatio">0%</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-download" id="btnDownload">💾 TẢI VỀ</button>
        <button class="btn btn-copy" id="btnCopy">📋 COPY</button>
      </div>
      <button class="btn btn-reset" id="btnReset">🔄 RESET</button>
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Đang xử lý...</div>
    </div>

    <div class="footer">
      ⚡ HVQ DEV TEAM © 2026 ⚡
      <span class="credit">App được phát triển bởi HVQ</span>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ═══ MATRIX RAIN ═══ */
(function initMatrix() {
  var canvas = document.getElementById("matrixCanvas");
  var ctx = canvas.getContext("2d");
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  var chars = "HVQ01ABCDEF9XYZ!@#$%&*";
  var charsArr = chars.split("");
  var fontSize = 14;
  var columns = Math.floor(canvas.width / fontSize);
  var drops = [];
  for (var i = 0; i < columns; i++) drops[i] = Math.random() * canvas.height;
  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";
    for (var i = 0; i < drops.length; i++) {
      var text = charsArr[Math.floor(Math.random() * charsArr.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 50);
})();

/* ═══ TERMINAL ═══ */
(function initTerminal() {
  var el = document.getElementById("terminalText");
  var lines = ["> init secure_module...", "> loading encryption...", "> bypass firewall: OK", "> waiting for key..."];
  var currentLine = 0, currentChar = 0, display = "";
  function type() {
    if (currentLine >= lines.length) {
      setTimeout(function () { display = ""; el.textContent = ""; currentLine = 0; currentChar = 0; type(); }, 3000);
      return;
    }
    var line = lines[currentLine];
    if (currentChar < line.length) {
      display += line[currentChar];
      el.textContent = display;
      currentChar++;
      setTimeout(type, 40);
    } else {
      display += "\n"; currentLine++; currentChar = 0;
      setTimeout(type, 500);
    }
  }
  type();
})();

function checkKey(key) {
  var k = (key || "").trim().toUpperCase();
  if (k === _a) return { valid: true, admin: true, type: "admin" };
  if (k === _k30) return { valid: true, admin: false, type: "30d" };
  if (_k.indexOf(k) > -1) return { valid: true, admin: false, type: "10h" };
  return { valid: false, admin: false, type: null };

function saveKey(key, isAdmin, type) {
  try {
    localStorage.setItem(STORAGE_KEY, key);
    if (isAdmin) {
      localStorage.setItem(STORAGE_ADMIN, "1");
      localStorage.removeItem(STORAGE_EXPIRE);
    } else {
      localStorage.setItem(STORAGE_ADMIN, "0");
      var duration = (type === "30d") ? KEY_30D_MS : KEY_10H_MS;
      localStorage.setItem(STORAGE_EXPIRE, String(Date.now() + duration));
    }
  } catch (e) {}
}

function removeKey() {

    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_EXPIRE);
    localStorage.removeItem(STORAGE_ADMIN);
  } catch (e) {}
}

function loadKey() { try { return localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { return ""; } }
function isAdminSaved() { try { return localStorage.getItem(STORAGE_ADMIN) === "1"; } catch (e) { return false; } }
function getExpire() { try { var e = localStorage.getItem(STORAGE_EXPIRE); return e ? parseInt(e, 10) : 0; } catch (err) { return 0; } }

function isSessionValid() {
  var key = loadKey();
  if (!key) return false;
  if (isAdminSaved() && key === _a) return true;
  var expire = getExpire();
  if (!expire) return false;
  return Date.now() < expire;
}

function getRemainingTime() {
  if (isAdminSaved() && loadKey() === _a) return -1;
  var expire = getExpire();
  if (!expire) return 0;
  return Math.max(0, expire - Date.now());
}

function formatRemaining(ms) {
  if (ms < 0) return "👑 VĨNH VIỄN";
  var totalSec = Math.floor(ms / 1000);
  var day = Math.floor(totalSec / 86400);
  var h = Math.floor((totalSec % 86400) / 3600);
  var m = Math.floor((totalSec % 3600) / 60);
  var s = totalSec % 60;
  if (day > 0) return day + "d " + h + "h " + m + "m " + s + "s";
  return h + "h " + m + "m " + s + "s";
}

function tryLogin() {
  var key = keyInput.value.trim().toUpperCase();
  var result = checkKey(key);

  if (!key) { keyErr.textContent = "⚠️ Chưa nhập key"; return; }

  if (result.valid) {
    saveKey(key, result.admin, result.type);
    keyErr.textContent = "";
    keyInput.value = "";
    keyInput.blur();
    document.activeElement.blur();
    window.scrollTo(0, 0);
    showMain();

    if (result.admin) {
      toast("👑 ADMIN MODE");
    } else if (result.type === "30d") {
      toast("📅 Key 30 ngày");
      setTimeout(function () {
        showModal("📅", "Key hợp lệ!", "Thời gian sử dụng: <b style='color:#00ff88;'>30 ngày</b>", "#00ff88");

var sessionTimer = null;

function updateTimerDisplay() {
  var el = document.getElementById("sessionTimer");
  if (!el) return;
  var remaining = getRemainingTime();
  el.textContent = formatRemaining(remaining);
  if (remaining < 0) el.style.color = "#00ff88";
  else if (remaining < 10 * 60 * 1000) el.style.color = "#ff3b3b";
  else if (remaining < 60 * 60 * 1000) el.style.color = "#ffd93b";
  else el.style.color = "#00ff88";
}

function startSessionTimer() {
  if (sessionTimer) clearInterval(sessionTimer);
  updateTimerDisplay();
  sessionTimer = setInterval(function () {
    updateTimerDisplay();
    if (!isSessionValid()) {
      clearInterval(sessionTimer);
      sessionTimer = null;
      removeKey();
      showLogin();
      keyErr.textContent = "⏰ Key đã hết hạn!";
      setTimeout(function () {
        showModal("⏰", "Key hết hạn!", "Vui lòng liên hệ <b style='color:#00ff88;'>HVQ</b> để gia hạn.", "#ff3b3b");
      }, 200);
    }
  }, 1000);
}

function stopSessionTimer() { if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; } }

/* ═══ ENCODER ═══ */
var encodedResult = "";
var originalFileName = "";
var dropZone = document.getElementById("dropZone");
var fileInput = document.getElementById("fileInput");
var fileInfo = document.getElementById("fileInfo");
var progress = document.getElementById("progress");

function setProgress(pct, text) {
  progress.classList.add("show");
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = text;
}
function hideProgress() {
  setTimeout(function () {
    progress.classList.remove("show");
    document.getElementById("progressFill").style.width = "0%";
  }, 800);
}

function hexEncode(str) {
  var out = "";
  for (var i = 0; i < str.length; i++) out += "\\x" + str.charCodeAt(i).toString(16).padStart(2, "0");
  return out;
}

function hexAllStrings(code) {
  var result = "", i = 0, inString = false, quote = null, currentString = "";
  while (i < code.length) {
    var ch = code[i];
    var prevCh = i > 0 ? code[i - 1] : "";
    if (!inString && ch === "/" && code[i + 1] === "/") {
      while (i < code.length && code[i] !== "\n") { result += code[i]; i++; }
      continue;
    }
    if (!inString && ch === "/" && code[i + 1] === "*") {
      result += "/*"; i += 2;
      while (i < code.length && !(code[i] === "*" && code[i + 1] === "/")) { result += code[i]; i++; }
      if (i < code.length) { result += "*/"; i += 2; }
      continue;
    }
    if (!inString && (ch === '"' || ch === "'" || ch === "`")) {
      if (prevCh !== "\\") { inString = true; quote = ch; currentString = ""; i++; continue; }
    }
    if (inString && ch === quote && prevCh !== "\\") {
      var hexStr = "";
      for (var k = 0; k < currentString.length; k++) hexStr += "\\x" + currentString.charCodeAt(k).toString(16).padStart(2, "0");
      result += '"' + hexStr + '"';
      inString = false; quote = null; currentString = ""; i++;
      continue;
    }
    if (inString) { currentString += ch; i++; continue; }
    result += ch; i++;
  }
  return result;
}

function bracketNotation(code) {
  var props = ["log","warn","error","getElementById","querySelector","querySelectorAll","createElement","appendChild","removeChild","addEventListener","style","value","innerHTML","textContent","disabled","children","length","push","shift","split","trim","toString","charCodeAt","onclick","click","focus","dispatchEvent","setTimeout","setInterval","clearTimeout","clearInterval","getBoundingClientRect","offsetParent"];
  var result = code;
  for (var i = 0; i < props.length; i++) {
    var re = new RegExp("\\." + props[i] + "\\b", "g");
    result = result.replace(re, '["' + hexEncode(props[i]) + '"]');
  }
  return result;
}

function addJunk(code) {
  function rh(n) {
    var s = "", c = "0123456789abcdef";
    for (var i = 0; i < n; i++) s += c[Math.floor(Math.random() * 16)];
    return s;
  }
  var junk = [
    "var _0x" + rh(6) + "=function(){};",
    "var _0x" + rh(6) + "=['" + rh(8) + "','" + rh(8) + "'];",
    "var _0x" + rh(6) + "=0x" + rh(4) + ";"
  ].join("\n");
  return junk + "\n" + code + "\n" + junk;
}

function base64Wrap(code) {
  try {
    var enc = btoa(unescape(encodeURIComponent(code)));
    return 'eval(decodeURIComponent(escape(atob("' + enc + '"))));';
  } catch (e) { return code; }
}

function encodeCode(input) {
  var code = input;
  var anyChecked = document.getElementById("optHex").checked || document.getElementById("optBracket").checked || document.getElementById("optJunk").checked || document.getElementById("optBase64").checked;
  if (!anyChecked) { toast("⚠️ Chưa chọn tùy chọn nào!", true); return input; }
  if (document.getElementById("optHex").checked) code = hexAllStrings(code);
  if (document.getElementById("optBracket").checked) code = bracketNotation(code);
  if (document.getElementById("optJunk").checked) code = addJunk(code);
  if (document.getElementById("optBase64").checked) code = base64Wrap(code);
  return code;
}

function handleFile(file) {
  if (!file) return;
  var name = file.name.toLowerCase();
  if (!name.endsWith(".js")) { toast("❌ Chỉ nhận file .js", true); return; }
  originalFileName = file.name;
  setProgress(10, "Đang đọc file...");
  var reader = new FileReader();
  reader.onload = function (e) {
    var content = e.target.result;
    setProgress(30, "Đọc xong " + content.length + " ký tự");
    setTimeout(function () {
      setProgress(50, "Đang mã hóa...");
      try {
        encodedResult = encodeCode(content);
        setProgress(90, "Hoàn tất!");
        document.getElementById("fileName").textContent = file.name;
        document.getElementById("statIn").textContent = content.length;
        document.getElementById("statOut").textContent = encodedResult.length;
        document.getElementById("statRatio").textContent = Math.round(encodedResult.length / content.length * 100) + "%";
        fileInfo.classList.add("show");
        setProgress(100, "✅ Mã hóa xong!");
        toast("✅ Đã mã hóa " + file.name);
        setTimeout(hideProgress, 1200);
      } catch (err) {
        setProgress(0, "❌ Lỗi: " + err.message);
        toast("❌ " + err.message, true);
        setTimeout(hideProgress, 2000);
      }
    }, 300);
  };
  reader.onerror = function () { toast("❌ Không đọc được file", true); };
  reader.readAsText(file, "UTF-8");
}

function autoDownload() {
  if (!encodedResult) return;
  var outName = originalFileName;
  if (outName.endsWith(".user.js")) outName = outName.replace(".user.js", ".encoded.user.js");
  else if (outName.endsWith(".js")) outName = outName.replace(".js", ".encoded.user.js");
  else outName += ".encoded.user.js";
  var blob = new Blob([encodedResult], { type: "text/javascript;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = outName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("💾 " + outName);
}

dropZone.onclick = function () { fileInput.click(); };
fileInput.onchange = function (e) {
  if (e.target.files && e.target.files[0]) { handleFile(e.target.files[0]); fileInput.value = ""; }
};

["dragenter", "dragover"].forEach(function (ev) { dropZone.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }); });
["dragleave", "drop"].forEach(function (ev) { dropZone.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }); });
dropZone.addEventListener("drop", function (e) { e.preventDefault(); e.stopPropagation(); var files = e.dataTransfer.files; if (files && files.length > 0) handleFile(files[0]); });
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("drop", function (e) { e.preventDefault(); });

document.getElementById("btnDownload").onclick = function () { if (!encodedResult) { toast("Chưa có code!", true); return; } autoDownload(); };
document.getElementById("btnCopy").onclick = function () {
  if (!encodedResult) { toast("Chưa có code!", true); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(encodedResult).then(function () { toast("📋 Đã copy!"); }).catch(function () { fallbackCopy(encodedResult); });
  } else { fallbackCopy(encodedResult); }
};

function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("📋 Đã copy!"); } catch (e) { toast("❌ Không copy được", true); }
  document.body.removeChild(ta);
}

document.getElementById("btnReset").onclick = function () {
  encodedResult = ""; originalFileName = "";
  fileInfo.classList.remove("show"); fileInput.value = "";
  toast("🔄 Đã reset");
};
